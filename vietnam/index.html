<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f8c"><title>VIETNAM TRIP 2026｜胡志明 8 天 7 夜</title><style>
:root{--bg:#f4f8f8;--surface:#fff;--sea:#087f8c;--ink:#17343a;--muted:#789096;--line:#e5eeee;--orange:#ff8b5a;--shadow:0 12px 35px rgba(16,69,76,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;line-height:1.55}button,input{font:inherit}button{cursor:pointer}.app{max-width:720px;margin:auto;padding-bottom:94px}.topbar{position:sticky;top:0;z-index:10;background:#f4f8f8eb;backdrop-filter:blur(16px);padding:13px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900}.brand span{color:var(--sea)}.tiny{font-size:12px;color:var(--muted)}.hero{margin:14px 16px 0;border-radius:27px;padding:26px 22px;background:linear-gradient(145deg,#075b66,#0b8793 65%,#5fc4ca);color:white;box-shadow:var(--shadow)}.eyebrow{font-size:12px;letter-spacing:.17em;opacity:.8}.hero h1{font-size:36px;line-height:1.12;margin:12px 0}.hero p{font-size:14px;margin:0}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px}.tile{border:1px solid var(--line);border-radius:18px;background:white;padding:15px 6px;box-shadow:var(--shadow);color:var(--ink);font-weight:750}.tile b{display:block;font-size:23px;margin-bottom:5px}.section{display:none;padding:0 16px}.section.active{display:block}.heading{font-size:20px;font-weight:850;margin:18px 2px 12px}.days{display:flex;overflow:auto;gap:8px;padding:5px 0 14px}.daybtn{border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);padding:10px 13px;white-space:nowrap}.daybtn.active{background:var(--sea);color:#fff}.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}.time{font-size:12px;color:var(--sea);font-weight:800}.name{font-size:18px;font-weight:800;margin:5px 0}.desc{font-size:13px;color:#607a80}.btn{display:inline-block;background:#e6f5f5;border:0;border-radius:12px;padding:9px 12px;color:#075b66;text-decoration:none;font-size:13px;margin-top:10px}.notice{background:#e9f2f2;border-radius:15px;padding:15px;color:#557278;font-size:13px}.field{display:block;width:100%;padding:13px;margin:8px 0;border:1px solid #d9e7e7;border-radius:12px}.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:8px;background:#ffffffed;backdrop-filter:blur(12px);padding:10px 10px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}.bottom button{background:#e9f4f4;color:#126975;border:0;border-radius:13px;padding:10px 15px;font-size:13px;font-weight:700}.total{font-weight:800;color:var(--sea)}@media(max-width:360px){.bottom button{padding:10px 9px}.hero h1{font-size:30px}}
</style></head><body><div class="app"><div class="topbar"><div class="brand">VIETNAM <span>TRIP</span></div><div class="tiny">2026 · 8天7夜</div></div><div class="hero"><div class="eyebrow">HO CHI MINH CITY · 2026</div><h1>越南旅行<br>隨身手帳</h1><p>12/19 — 12/26 ｜ 行程・導航・記帳</p></div><div class="tiles"><button class="tile" onclick="go('days')"><b>🗓️</b>每日行程</button><button class="tile" onclick="go('stay')"><b>🏠</b>住宿交通</button><button class="tile" onclick="go('tools')"><b>💰</b>旅行工具</button></div><section id="days" class="section active"><div class="heading">每日行程</div><div class="days" id="tabs"></div><div id="events"></div><div class="card"><div class="name">🗺️ 當日地點地圖</div><div class="desc">查看當天有地址的景點，依行程順序顯示。</div><div id="dayMap"></div></div></section><section id="stay" class="section"><div class="heading">住宿與交通</div><div class="card"><div class="time">住宿</div><div class="name">HOD Apartment Tan Dinh</div><div class="desc">詳細地址、入住時間請依訂房確認信核對。</div><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=HOD%20Apartment%20Tan%20Dinh">Google Maps ↗</a></div><div class="notice">去程及回程均有機場包車安排。請確認司機聯絡方式、集合地點與航班變動。</div></section><section id="tools" class="section"><div class="heading">旅行工具</div><div class="card"><div class="name">越南盾 → 台幣</div><div class="desc">請輸入當日實際匯率：1 TWD = ? VND</div><input class="field" id="rate" type="number" min="0" placeholder="匯率 VND / TWD"><input class="field" id="amount" type="number" min="0" placeholder="越南盾金額"><div id="converted" class="total">請輸入匯率</div></div><div class="card"><div class="name">旅費記帳</div><input class="field" id="item" placeholder="支出項目"><input class="field" id="cost" type="number" min="0" placeholder="金額 VND"><button class="btn" onclick="addExpense()">＋ 新增</button><button class="btn" onclick="exportExpenses()">匯出 CSV</button><div id="ledger"></div><div class="desc">僅儲存在目前裝置的瀏覽器，尚不支援多人同步。</div></div></section></div><nav class="bottom"><button onclick="go('days')">🗓 行程</button><button onclick="go('stay')">🏠 住宿</button><button onclick="go('tools')">💰 記帳</button></nav><script>
const data=[["12/19 六","抵達西貢",[["09:10–11:35","桃園 → 胡志明市","桃園 T2 → 新山一 T2",""],["抵達後","機場包車、民宿","HOD Apartment Tan Dinh","HOD Apartment Tan Dinh Ho Chi Minh City"],["17:00","Free Food Tour","集合 Tam Tong Mieu, 82 Cao Thang, District 3","Tam Tong Mieu 82 Cao Thang Ho Chi Minh City"]]],["12/20 日","市區散策",[["早餐","Phở Thìn","113 Nguyễn Thái Bình","113 Nguyen Thai Binh Ho Chi Minh City"],["換錢","濱城市場周邊","1 Nguyễn An Ninh","1 Nguyen An Ninh Ho Chi Minh City"],["逛街","waa. Studios","店址待確認","waa Studios Ho Chi Minh City"],["景點","濱城市場","Ben Thanh Market","Ben Thanh Market Ho Chi Minh City"],["購物","Dauple、Ka's clothing","店址待確認",""],["小吃","芭蕉糯米飯","Chuối nếp nướng Võ Văn Tần","Chuoi nep nuong Vo Van Tan Ho Chi Minh City"],["美食","錦麗河粉、Little","店址待確認",""]]],["12/21 一","步行導覽",[["09:00","Free Walking Tour","The Manufacture Courtyard 集合，約 3 小時","The Manufacture Courtyard Ho Chi Minh City"]]],["12/22 二","待安排",[]],["12/23 三","郊區一日遊",[["07:00–19:00","古芝地道＋湄公河三角洲","集合方式及時間請以旅行社確認單為準",""]]],["12/24 四","待安排",[]],["12/25 五","待安排",[]],["12/26 六","返台",[["15:45–20:10","胡志明市 → 桃園","新山一 T2 → 桃園 T2，預留機場接送時間",""]]]];let activeDay=0;function go(id){document.querySelectorAll('.section').forEach(e=>e.classList.toggle('active',e.id===id));window.scrollTo({top:0,behavior:'smooth'})}function day(i){activeDay=i;document.getElementById('tabs').innerHTML=data.map((d,j)=>'<button class="daybtn '+(j===i?'active':'')+'" onclick="day('+j+')">'+d[0]+'</button>').join('');let d=data[i];document.getElementById('events').innerHTML='<div class="heading">'+d[1]+'</div>'+(d[2].length?d[2].map(e=>'<article class="card"><div class="time">'+e[0]+'</div><div class="name">'+e[1]+'</div><div class="desc">'+e[2]+'</div>'+(e[3]?'<a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(e[3])+'">地圖導航 ↗</a>':'')+'</article>').join(''):'<div class="notice">當日尚無已確認行程，保留自由安排。</div>');document.getElementById('dayMap').innerHTML=d[2].filter(e=>e[3]).map((e,j)=>'<a class="btn" style="margin-right:6px" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(e[3])+'">'+(j+1)+'. '+e[1]+' ↗</a>').join('')||'<p class="desc">這一天尚無可導航的地點。</p>'}day(0);
const rate=document.getElementById('rate'),amount=document.getElementById('amount');function convert(){let r=+rate.value,a=+amount.value;document.getElementById('converted').textContent=r>0?'約 NT$ '+Math.round(a/r).toLocaleString():'請輸入匯率'}rate.oninput=convert;amount.oninput=convert;
let expenses=[];try{expenses=JSON.parse(localStorage.getItem('vietnam-expenses')||'[]')}catch(e){}function escapeHtml(v){return String(v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function render(){document.getElementById('ledger').innerHTML=expenses.map((e,i)=>'<p>'+escapeHtml(e.name)+' · '+Number(e.cost).toLocaleString()+' VND <button class="btn" onclick="removeExpense('+i+')">刪除</button></p>').join('')+'<p class="total">合計 '+expenses.reduce((a,e)=>a+Number(e.cost),0).toLocaleString()+' VND</p>'}function save(){localStorage.setItem('vietnam-expenses',JSON.stringify(expenses));render()}function addExpense(){let name=document.getElementById('item').value.trim(),cost=+document.getElementById('cost').value;if(!name||cost<=0)return alert('請填寫項目及金額');expenses.push({name,cost});document.getElementById('item').value='';document.getElementById('cost').value='';save()}function removeExpense(i){expenses.splice(i,1);save()}function exportExpenses(){let rows=[['項目','金額 VND'],...expenses.map(e=>[e.name,e.cost])];let csv='\uFEFF'+rows.map(row=>row.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='vietnam-expenses.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}render();
</script></body></html>

/* ===== 2026 Okinawa Deluxe Visual Upgrade ===== */
:root{
  --sand:#fffaf2;
  --coral:#ff8066;
  --sun:#ffd166;
  --deep:#073b4c;
}
body{
  background:
    radial-gradient(circle at 15% 0%, rgba(255,209,102,.18), transparent 25rem),
    radial-gradient(circle at 95% 10%, rgba(8,127,140,.12), transparent 27rem),
    #edf5f4;
}
.app{background:linear-gradient(180deg,#f7fbfa 0%,#f4f8f8 55%,#fffaf5 100%)}
.topbar{
  background:rgba(250,253,252,.82);
  border-bottom:1px solid rgba(255,255,255,.7);
  box-shadow:0 8px 28px rgba(7,59,76,.05);
}
.hero{
  min-height:430px;
  padding:28px 22px 22px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  background:
    linear-gradient(180deg,rgba(4,35,47,.04) 0%,rgba(4,35,47,.28) 42%,rgba(4,35,47,.88) 100%),
    url('https://commons.wikimedia.org/wiki/Special:FilePath/JP%20%E6%B2%96%E7%B9%A9%20Okinawa%20Nago%20Kouri%20Island%20n%20Road%20Bridge%20n%20Beach%20January%202026%20N13P%2010.jpg?width=1280') center/cover no-repeat;
  box-shadow:0 22px 50px rgba(7,59,76,.18);
}
.hero:before{
  content:"OKINAWA 2026";
  position:absolute;
  top:20px;left:20px;
  font-size:calc(10px + var(--font-add, 2px));
  font-weight:900;
  letter-spacing:.2em;
  padding:7px 10px;
  border-radius:999px;
  background:rgba(255,255,255,.17);
  border:1px solid rgba(255,255,255,.28);
  backdrop-filter:blur(10px);
}
.hero:after{background:radial-gradient(circle,rgba(255,255,255,.20),transparent 70%)}
.hero h1{font-size:calc(42px + var(--font-add, 2px));letter-spacing:-.04em;text-shadow:0 5px 20px rgba(0,0,0,.25)}
.hero p{font-size:calc(14px + var(--font-add, 2px));max-width:420px}
.hero .count{backdrop-filter:blur(10px);background:rgba(255,255,255,.18)}
.hero-stat{
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(8px);
}
.section-title h2{letter-spacing:-.02em}
.section-title small{background:#edf7f6;padding:4px 8px;border-radius:999px}
.card{border-color:rgba(220,233,232,.82);box-shadow:0 16px 42px rgba(12,76,83,.08)}
.day-chip{transition:.2s;min-width:94px}
.day-chip:hover{transform:translateY(-2px)}
.day-chip.active{
  background:linear-gradient(135deg,#087f8c,#0aa2ac);
  box-shadow:0 10px 24px rgba(8,127,140,.23);
}
.day-head{background:linear-gradient(180deg,#fff,#fbfdfd)}
.day-head h3{letter-spacing:-.025em}
.pill{background:#e5f7f5;border:1px solid #d1efec}
.timeline{padding-top:16px}
.item{padding-bottom:20px}
.item:before{box-shadow:0 0 0 5px #e8f6f4}
.place{font-size:calc(15.5px + var(--font-add, 2px))}
.btn{
  border:1px solid #e1eeee;
  background:#f5fbfa;
  transition:.18s;
}
.btn:hover{transform:translateY(-1px);background:#e9f7f5}
.quick{
  background:linear-gradient(180deg,#fff,#fbfdfd);
  transition:.18s;
}
.quick:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(7,59,76,.10)}

.visual-strip{
  display:flex;
  gap:12px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  padding:2px 1px 8px;
  scrollbar-width:none;
}
.visual-strip::-webkit-scrollbar{display:none}
.visual-card{
  min-width:238px;
  height:170px;
  position:relative;
  border-radius:22px;
  overflow:hidden;
  scroll-snap-align:start;
  box-shadow:0 16px 35px rgba(7,59,76,.12);
  background:#dcebea;
}
.visual-card img{
  width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .35s ease;
}
.visual-card:hover img{transform:scale(1.035)}
.visual-card:after{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 40%,rgba(5,36,45,.82));
}
.visual-label{
  position:absolute;z-index:2;left:14px;right:14px;bottom:12px;color:#fff;
}
.visual-label b{display:block;font-size:calc(16px + var(--font-add, 2px))}
.visual-label span{font-size:calc(10px + var(--font-add, 2px));opacity:.82}

.day-photo-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  padding:12px 12px 2px;
}
.day-photo-grid.single{grid-template-columns:1fr}
.day-photo{
  height:142px;
  position:relative;
  border-radius:17px;
  overflow:hidden;
  background:#dcebea;
}
.day-photo.big{height:180px}
.day-photo img{width:100%;height:100%;object-fit:cover;display:block}
.day-photo:after{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 45%,rgba(6,44,54,.76));
}
.day-photo span{
  position:absolute;z-index:2;left:11px;bottom:9px;
  color:#fff;font-size:calc(11px + var(--font-add, 2px));font-weight:800;
  text-shadow:0 2px 10px rgba(0,0,0,.35);
}
.photo-note{
  margin:8px 14px 0;
  font-size:calc(10px + var(--font-add, 2px));
  color:var(--muted);
}
.photo-credit{
  margin-top:12px;
  padding:12px 13px;
  background:#f4f8f8;
  border:1px solid var(--line);
  border-radius:14px;
  line-height:1.7;
}
.photo-credit a{color:var(--sea);font-weight:700}
.credit-title{font-weight:900;color:var(--ink);margin-bottom:3px}
@media(max-width:420px){
  .hero{min-height:390px}
  .hero h1{font-size:calc(36px + var(--font-add, 2px))}
  .visual-card{min-width:215px;height:155px}
  .day-photo{height:125px}
}


/* ===== Notes + Interactive Map Upgrade ===== */
.travel-tip{
  margin:8px 0 2px;
  padding:10px 11px;
  border-radius:13px;
  font-size:calc(11.5px + var(--font-add, 2px));
  line-height:1.65;
  border:1px solid #e4efee;
}
.travel-tip.reco{background:#effaf7;border-color:#d3eee7}
.travel-tip.warn{background:#fff8ec;border-color:#f3dfb3}
.travel-tip b{font-weight:900}
.map-card{padding:12px}
#tripMap{
  height:500px;
  border-radius:20px;
  overflow:hidden;
  border:1px solid #dfeeed;
  z-index:1;
}
.map-toolbar{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:2px 0 10px;
  scrollbar-width:none;
}
.map-toolbar::-webkit-scrollbar{display:none}
.map-filter{
  white-space:nowrap;
  border:1px solid #dcebea;
  background:#fff;
  padding:8px 11px;
  border-radius:999px;
  font-size:calc(11px + var(--font-add, 2px));
  font-weight:900;
  cursor:pointer;
}
.map-filter.active{background:#087f8c;color:#fff;border-color:#087f8c}
.map-legend{
  display:flex;
  flex-wrap:wrap;
  gap:7px 11px;
  margin-top:10px;
  font-size:calc(10px + var(--font-add, 2px));
  color:#617679;
}
.map-dot{width:9px;height:9px;border-radius:99px;display:inline-block;margin-right:4px}
.pin-label{
  width:30px;height:30px;border-radius:50% 50% 50% 0;
  transform:rotate(-45deg);
  border:2px solid #fff;
  box-shadow:0 4px 12px rgba(0,0,0,.25);
  display:flex;align-items:center;justify-content:center;
}
.pin-label span{transform:rotate(45deg);font-size:calc(12px + var(--font-add, 2px));font-weight:900;color:#fff}
.leaflet-popup-content{margin:12px 14px;min-width:185px}
.popup-title{font-size:calc(13px + var(--font-add, 2px));font-weight:900;margin-bottom:4px}
.popup-meta{font-size:calc(10px + var(--font-add, 2px));color:#687a7c;line-height:1.5}
.popup-nav{
  display:inline-block;margin-top:8px;padding:7px 9px;border-radius:9px;
  background:#e9f7f5;color:#087f8c;text-decoration:none;font-size:calc(10px + var(--font-add, 2px));font-weight:900
}
.map-caution{
  margin-top:10px;padding:10px 11px;border-radius:12px;background:#f5f8f8;
  border:1px solid #e0ebea;font-size:calc(10px + var(--font-add, 2px));color:#69797b;line-height:1.6
}
.unmapped-list{
  margin-top:10px;padding:10px 11px;border-radius:12px;background:#fff9ef;
  border:1px solid #f0dfbb;font-size:calc(10px + var(--font-add, 2px));line-height:1.7
}
@media(max-width:520px){
  #tripMap{height:430px}
}


/* ===== Robust map marker fix ===== */
.trip-number-marker{
  background:transparent !important;
  border:none !important;
}
.trip-number-marker .marker-bubble{
  width:34px;
  height:34px;
  border-radius:50%;
  border:3px solid #fff;
  box-shadow:0 4px 13px rgba(0,0,0,.28);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:calc(12px + var(--font-add, 2px));
  line-height:1;
  font-weight:900;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}
.map-load-error{
  display:none;
  padding:16px;
  border:1px solid #f0d6ae;
  border-radius:16px;
  background:#fff8ec;
  color:#6d583b;
  line-height:1.7;
  font-size:calc(12px + var(--font-add, 2px));
}


/* ===== Marker category + parking upgrade ===== */
.poi-marker{
  position:relative;
  width:42px;height:42px;
  border-radius:50%;
  border:3px solid #fff;
  box-shadow:0 5px 15px rgba(0,0,0,.28);
  display:flex;align-items:center;justify-content:center;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}
.poi-marker .poi-emoji{
  font-size:calc(19px + var(--font-add, 2px));line-height:1;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.12));
}
.poi-marker .day-badge{
  position:absolute;right:-7px;top:-7px;
  min-width:22px;height:22px;padding:0 4px;
  border-radius:999px;
  background:#fff;color:#18383c;
  border:2px solid currentColor;
  display:flex;align-items:center;justify-content:center;
  font-size:calc(8px + var(--font-add, 2px));font-weight:1000;letter-spacing:-.02em;
  box-shadow:0 2px 7px rgba(0,0,0,.18);
}
.parking-map-marker{
  background:transparent !important;
  border:none !important;
}
.parking-map-marker .parking-bubble{
  width:28px;height:28px;
  border-radius:8px;
  background:#1667a8;
  color:#fff;
  border:2px solid #fff;
  box-shadow:0 4px 12px rgba(0,0,0,.25);
  display:flex;align-items:center;justify-content:center;
  font-size:calc(13px + var(--font-add, 2px));font-weight:1000;
}
.type-legend{
  display:flex;gap:8px;overflow-x:auto;
  padding:10px 0 2px;scrollbar-width:none;
}
.type-legend::-webkit-scrollbar{display:none}
.type-chip{
  white-space:nowrap;
  padding:6px 9px;border-radius:999px;
  background:#f5f9f8;border:1px solid #dfeae9;
  font-size:calc(10px + var(--font-add, 2px));font-weight:800;color:#536b6f;
}
.parking-info{
  margin:8px 0 2px;
  padding:11px 12px;
  border-radius:14px;
  background:#eef6ff;
  border:1px solid #d5e7fa;
  font-size:calc(11px + var(--font-add, 2px));
  line-height:1.65;
}
.parking-info .parking-title{
  font-weight:1000;color:#165a8d;margin-bottom:4px;
}
.parking-info .parking-grid{
  display:grid;grid-template-columns:auto 1fr;gap:2px 8px;
}
.parking-info .parking-label{color:#667a7d;font-weight:800}
.parking-info .parking-value{color:#233d42;font-weight:700}
.parking-info .parking-note{
  margin-top:6px;color:#607579;font-size:calc(10px + var(--font-add, 2px));
}
.parking-info a{
  display:inline-block;margin-top:7px;
  padding:7px 9px;border-radius:9px;
  background:#fff;color:#1768a8;
  border:1px solid #cfe0f1;
  text-decoration:none;font-weight:900;
}
.popup-type{
  display:inline-block;margin-bottom:5px;
  padding:3px 7px;border-radius:999px;
  background:#f1f6f5;color:#536a6e;font-size:calc(9px + var(--font-add, 2px));font-weight:900;
}
.popup-parking{
  margin-top:8px;padding:8px 9px;border-radius:10px;
  background:#eef6ff;border:1px solid #d8e7f5;
  font-size:calc(10px + var(--font-add, 2px));line-height:1.55;color:#39545b;
}
.parking-disclaimer{
  margin-top:10px;padding:10px 11px;border-radius:12px;
  background:#fff8ec;border:1px solid #f0ddb5;
  font-size:calc(10px + var(--font-add, 2px));line-height:1.65;color:#6c5b3d;
}


/* ===== Clean Guide Layout v6 ===== */

  --page:#f2f5f4;

  --ink-strong:#18373c;

}
body{background:var(--page)}

  font-size:calc(9px + var(--font-add, 2px));font-weight:1000;letter-spacing:.18em;color:#849698;margin-bottom:4px;
}
.clean-title{align-items:center;margin-bottom:14px}
.clean-title h2{font-size:calc(23px + var(--font-add, 2px));letter-spacing:-.035em}
.clean-title small{background:transparent;padding:0;color:#87989a}
.hero{min-height:360px;border-radius:30px;padding:26px 21px 22px;margin-top:14px}
.hero h1{font-size:calc(39px + var(--font-add, 2px))}
.hero-grid{gap:7px}
.hero-stat{border:1px solid rgba(255,255,255,.12);border-radius:14px}
.card{border-color:var(--hair);box-shadow:0 10px 30px rgba(26,64,69,.06)}
.day-scroll{gap:8px;padding-bottom:12px}
.day-chip{

.time{font-size:calc(10px + var(--font-add, 2px))}

.note{font-size:calc(11px + var(--font-add, 2px));line-height:1.55}
.btnrow{margin-top:8px}
.btn{background:#f2f7f6;border:1px solid #e2ecea;border-radius:10px;padding:6px 9px}
.choices{padding:2px 18px 14px}

.alert{margin:0 18px 8px}

}

.mini-info{font-size:calc(10.5px + var(--font-add, 2px));line-height:1.6;color:#536a6e}
.mini-info b{color:#24454a}
.mini-parking{background:#eef6fb;border-radius:10px;padding:8px 9px}
.mini-parking a{color:#1768a8;font-weight:900;white-space:nowrap}

.spot-grid{display:grid;grid-template-columns:1fr;gap:14px}
.spot-card{background:#fff;border:1px solid var(--hair);border-radius:22px;overflow:hidden}
.spot-photo{height:205px;position:relative;background:#dce8e6}
.spot-photo img{width:100%;height:100%;object-fit:cover;display:block}

.spot-body{padding:16px}

.spot-body h3{margin:0 0 7px;font-size:calc(19px + var(--font-add, 2px));letter-spacing:-.025em}
.spot-body p{margin:0;color:#62777a;font-size:calc(12px + var(--font-add, 2px));line-height:1.8}
.spot-focus{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.spot-focus b{font-size:calc(10px + var(--font-add, 2px));color:#36575c;margin-right:2px}
.spot-focus span{

.spot-alert{
  margin-top:11px;padding:9px 10px;border-radius:11px;background:#fff5e8;color:#76511f;
  border:1px solid #f3dfbc;font-size:calc(10.5px + var(--font-add, 2px));line-height:1.6;
}
.spot-actions{display:flex;gap:7px;margin-top:13px}
.spot-actions a{

  border:1px solid #dbeae8;font-size:calc(10px + var(--font-add, 2px));font-weight:900;
}

.map-card{padding:14px;border-radius:24px}
#tripMap{height:440px;border-radius:17px}
.type-legend{padding-top:9px}
.parking-disclaimer,.map-caution,.unmapped-list{

}
.parking-disclaimer{background:#f5f8f8;border-color:#e3ebea;color:#667b7e}
.map-caution{background:#f5f8f8;border-color:#e3ebea}
.unmapped-list{background:#fff9ef;border-color:#f1e1c2}
#share .card{box-shadow:none}
.travel-tip,.parking-info{display:none!important}
.bottom{grid-template-columns:repeat(4,1fr);border-top-color:#e6edec}
.footer{padding-top:30px}

/* Old checklist presentation removed */
.check-card,.check-row{display:none!important}

@media(min-width:640px){
  .spot-grid{grid-template-columns:1fr 1fr}
  .spot-card:last-child{grid-column:1/-1}
}
@media(max-width:420px){
  .hero{min-height:335px}
  .hero h1{font-size:calc(35px + var(--font-add, 2px))}
  .spot-photo{height:185px}
  #tripMap{height:390px}
}


/* ===== Smart shopping + FX + expense tracker v7 ===== */
.saver-grid{display:grid;grid-template-columns:1fr;gap:11px}
.coupon-card{
  background:#fff;border:1px solid var(--hair);border-radius:18px;padding:15px;
  display:grid;gap:9px;
}
.coupon-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.coupon-brand{font-size:calc(15px + var(--font-add, 2px));font-weight:1000;color:#203f44}
.coupon-badge{
  flex:0 0 auto;padding:5px 8px;border-radius:999px;font-size:calc(9px + var(--font-add, 2px));font-weight:1000;
  background:#edf7f5;color:#08717a;border:1px solid #d7ebe8;
}
.coupon-card p{margin:0;font-size:calc(11px + var(--font-add, 2px));line-height:1.65;color:#65797d}
.coupon-note{
  padding:8px 9px;border-radius:10px;background:#fff8eb;border:1px solid #f1dfb9;
  font-size:calc(10px + var(--font-add, 2px));line-height:1.55;color:#6c5938;
}
.coupon-link{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 10px;border-radius:11px;background:#f1f7f6;border:1px solid #dfebe9;
  color:#08717a;font-size:calc(10.5px + var(--font-add, 2px));font-weight:1000;text-decoration:none;
}
.tax-note{
  margin-top:12px;padding:11px 12px;border-radius:14px;background:#f5f8f8;
  border:1px solid #e2eae9;font-size:calc(10.5px + var(--font-add, 2px));line-height:1.7;color:#5f7478;
}
.fx-card,.expense-card{
  background:#fff;border:1px solid var(--hair);border-radius:22px;padding:16px;
}
.fx-head{
  display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:13px;
}
.fx-rate{font-size:calc(24px + var(--font-add, 2px));font-weight:1000;letter-spacing:-.04em;color:#183e43}
.fx-sub{font-size:calc(9.5px + var(--font-add, 2px));color:#7a8d90;margin-top:3px;line-height:1.45}
.refresh-rate{
  border:1px solid #dce8e6;background:#f4f8f8;color:#567074;border-radius:11px;
  min-height:40px;padding:0 10px;font-weight:900;font-size:calc(10px + var(--font-add, 2px));cursor:pointer;
}
.converter{
  display:grid;grid-template-columns:1fr 34px 1fr;gap:8px;align-items:end;
}
.money-field label,.expense-form label{
  display:block;font-size:calc(9px + var(--font-add, 2px));font-weight:900;color:#718588;margin:0 0 5px;
}
.money-input,.expense-input,.expense-select{
  width:100%;box-sizing:border-box;border:1px solid #dce7e5;border-radius:12px;
  background:#fbfdfd;color:#1e3e43;min-height:44px;padding:9px 10px;font-size:calc(16px + var(--font-add, 2px));outline:none;
}
.money-input:focus,.expense-input:focus,.expense-select:focus{
  border-color:#63aaa9;box-shadow:0 0 0 3px rgba(8,127,140,.08);
}
.swap-arrow{
  height:44px;display:flex;align-items:center;justify-content:center;font-size:calc(17px + var(--font-add, 2px));color:#8aa0a2;
}
.fx-foot{
  margin-top:9px;font-size:calc(9.5px + var(--font-add, 2px));line-height:1.55;color:#829396;
}
.expense-summary{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:13px;
}
.money-stat{
  padding:12px;border-radius:14px;background:#f5f8f8;border:1px solid #e5edec;
}
.money-stat span{display:block;font-size:calc(9px + var(--font-add, 2px));color:#778b8e;font-weight:800;margin-bottom:3px}
.money-stat b{font-size:calc(18px + var(--font-add, 2px));color:#24464b;letter-spacing:-.025em}
.expense-form{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.expense-field.full{grid-column:1/-1}
.expense-add{
  grid-column:1/-1;min-height:44px;border:0;border-radius:12px;
  background:#087f8c;color:#fff;font-weight:1000;font-size:calc(12px + var(--font-add, 2px));cursor:pointer;
}
.expense-list{margin-top:14px;border-top:1px solid #e8efee}
.expense-row{
  display:grid;grid-template-columns:1fr auto;gap:9px;padding:11px 0;border-bottom:1px solid #edf2f1;
}
.expense-main{min-width:0}
.expense-title{
  font-size:calc(12px + var(--font-add, 2px));font-weight:900;color:#26464b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.expense-meta{font-size:calc(9.5px + var(--font-add, 2px));color:#7d8f92;margin-top:3px;line-height:1.5}
.expense-amount{text-align:right}
.expense-amount b{display:block;font-size:calc(12px + var(--font-add, 2px));color:#24464b}
.expense-amount span{font-size:calc(9px + var(--font-add, 2px));color:#87989a}
.expense-delete{
  border:0;background:transparent;color:#9c7777;font-size:calc(9px + var(--font-add, 2px));padding:3px 0 0;cursor:pointer;
}
.empty-expense{
  padding:16px 0 4px;text-align:center;color:#8a999b;font-size:calc(10.5px + var(--font-add, 2px));
}
.expense-actions{display:flex;gap:8px;margin-top:12px}
.secondary-action{
  flex:1;min-height:40px;border:1px solid #dfe9e7;border-radius:11px;
  background:#f7faf9;color:#587074;font-size:calc(10px + var(--font-add, 2px));font-weight:900;cursor:pointer;
}
.secondary-action.danger{color:#8e6262}
.offline-pill{
  display:inline-block;margin-top:4px;padding:3px 6px;border-radius:999px;
  background:#fff3e2;color:#8b6427;font-size:calc(8px + var(--font-add, 2px));font-weight:900;
}
@media(min-width:640px){
  .saver-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:390px){
  .converter{grid-template-columns:1fr}
  .swap-arrow{height:auto;transform:rotate(90deg)}
  .expense-form{grid-template-columns:1fr}
  .expense-field.full,.expense-add{grid-column:1}
}

/* ===== Hero redesign v16 ===== */
.hero{

  display:flex !important;
  flex-direction:column;
  justify-content:flex-end;
  gap:0;

    url('https://commons.wikimedia.org/wiki/Special:FilePath/JP%20%E6%B2%96%E7%B9%A9%20Okinawa%20Nago%20Kouri%20Island%20n%20Road%20Bridge%20n%20Beach%20January%202026%20N13P%2010.jpg?width=1280') center/cover no-repeat !important;
  aspect-ratio:4/5;
}

/* Remove the old absolutely-positioned badge completely. */
.hero:before{content:none !important;display:none !important}
.hero:after{
  content:"";
  position:absolute;
  inset:auto -70px -90px auto;
  width:240px;height:240px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.10),transparent 70%) !important;

}

.hero-meta{

  align-items:center;
  min-height:32px;
  padding:6px 10px;

}
.hero-tag{

  letter-spacing:.12em;
}
.hero-date{
  font-size:clamp(10px,2.8vw,12px) !important;
  letter-spacing:.06em;
}

.hero-copy{
  position:relative;
  z-index:2;
  margin-top:100px;
}
.hero .eyebrow{
  font-size:clamp(10px,3vw,12px) !important;
  line-height:1.45 !important;
  letter-spacing:.15em;
  opacity:.82;
  margin-bottom:8px;
  overflow-wrap:anywhere;
}
.hero h1{
  margin:0 !important;
  font-size:clamp(38px,10vw,50px) !important;
  line-height:1.02 !important;
  letter-spacing:-.055em !important;
  text-wrap:balance;
}
.hero p{
  margin:12px 0 0 !important;
  max-width:430px;
  font-size:clamp(14px,4vw,17px) !important;
  line-height:1.62 !important;
  opacity:.94;
  text-shadow:0 2px 12px rgba(0,0,0,.24);
}

.hero .count{
  position:relative;
  z-index:2;
  align-self:flex-start;
  margin-top:16px !important;
  padding:9px 12px;

.hero-grid{

}

.hero-stat span{

}

/* Font-size selector should enlarge reading text, but not break the cover. */

html[data-font-size="medium"] .hero{

/* ===== Shared split bill v18 ===== */
.sync-card{margin-top:12px;padding:13px;border:1px solid #e2eae9;border-radius:15px;background:#f8fbfa}
.sync-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sync-title{font-size:11px;font-weight:1000;color:#294b50}
.sync-status{padding:5px 8px;border-radius:999px;font-size:8.5px;font-weight:1000;background:#edf3f2;color:#6b7e81;border:1px solid #e0e8e7}
.sync-status.online{background:#eaf7f2;color:#26735d;border-color:#d0e9df}
.sync-status.warn{background:#fff5e7;color:#87602b;border-color:#eedbb8}
.sync-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
.sync-field label{display:block;font-size:9px;font-weight:900;color:#74878a;margin-bottom:4px}
.sync-field input{width:100%;box-sizing:border-box;min-height:42px;border:1px solid #dce7e5;border-radius:11px;background:#fff;padding:8px 10px;font-size:16px;color:#29484d}
.sync-actions{display:flex;gap:7px;margin-top:9px}
.sync-actions button{flex:1;min-height:40px;border-radius:11px;border:1px solid #dbe7e5;background:#fff;color:#526e72;font-size:10px;font-weight:1000}
.sync-actions button.primary{background:#087f8c;color:#fff;border-color:#087f8c}
.sync-note{margin-top:8px;font-size:9px;line-height:1.6;color:#7e9194}
.undo-last{flex:1;min-height:40px;border:1px solid #eed7d2;border-radius:11px;background:#fff7f5;color:#9a594e;font-size:10px;font-weight:1000;cursor:pointer}


/* ===== Compact UI v22 ===== */
.result-toggle{width:100%;margin-top:10px;min-height:44px;border:1px solid #d7e6e4;border-radius:13px;background:#f7fbfa;color:#315d62;font-size:11px;font-weight:1000;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px}
.result-toggle .chev{transition:transform .2s ease}
.result-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
.result-panel{display:none;margin-top:8px;border-top:1px dashed #dfe8e7;padding-top:8px}
.result-panel.open{display:block}
.compact-details{margin-top:10px;border:1px solid #e3ecea;border-radius:13px;background:#fbfdfd;overflow:hidden}
.compact-details summary{list-style:none;cursor:pointer;padding:11px 12px;font-size:10.5px;font-weight:1000;color:#49676b;display:flex;align-items:center;justify-content:space-between}
.compact-details summary::-webkit-details-marker{display:none}
.compact-details summary:after{content:"＋";font-size:14px;color:#799093}
.compact-details[open] summary:after{content:"－"}
.compact-body{padding:0 12px 12px}
.sync-card{padding:11px!important}

function addParkingInfo(){
  document.querySelectorAll(".place").forEach(place=>{
    const text=place.textContent||"";
    for(const p of parkingInfo){
      if(text.includes(p.k)){
        const nav="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p.q);
        const box=document.createElement("div");
        box.className="parking-info";
        box.innerHTML=
          '<div class="parking-title">🅿️ '+p.name+'</div>'+
          '<div class="parking-grid">'+
            '<div class="parking-label">車位</div><div class="parking-value">'+p.spaces+'</div>'+
            '<div class="parking-label">費用</div><div class="parking-value">'+p.fee+'</div>'+
          '</div>'+
          '<div class="parking-note">'+p.note+'</div>'+
          '<a target="_blank" rel="noopener" href="'+nav+'">🧭 停車場導航</a>';
        // Place after the tips block when possible.
        let anchor=place.nextElementSibling;
        if(anchor && !anchor.classList.contains("travel-tip") && !anchor.querySelector?.(".travel-tip")) anchor=place;
        if(anchor && anchor.querySelector?.(".travel-tip")) anchor.insertAdjacentElement("afterend",box);
        else place.insertAdjacentElement("afterend",box);
        break;
      }
    }
  });
}

function addTravelTips(){
  document.querySelectorAll(".place").forEach(place=>{
    const text = place.textContent || "";
    for(const t of placeTips){
      if(text.includes(t.k)){
        const box = document.createElement("div");
        box.innerHTML =
          '<div class="travel-tip reco"><b>✨ 推薦：</b>'+t.reco.replace(/^推薦：/,'')+'</div>'+
          '<div class="travel-tip warn"><b>⚠️ 注意：</b>'+t.warn.replace(/^注意：/,'')+'</div>';
        place.insertAdjacentElement("afterend", box);
        break;
      }
    }
  });
}


function addCompactDetails(){
  document.querySelectorAll(".place").forEach(place=>{
    const text=place.textContent||"";
    const tip=placeTips.find(t=>text.includes(t.k));
    const park=parkingInfo.find(p=>text.includes(p.k));
    if(!tip && !park) return;

    const details=document.createElement("details");
    details.className="poi-more";

    let inner='<summary>ℹ️ 推薦・注意・停車</summary><div class="poi-more-body">';
    if(tip){
      inner+='<div class="mini-info"><b>✨ 推薦</b><br>'+tip.reco.replace(/^推薦：/,'')+'</div>';
      inner+='<div class="mini-info"><b>⚠️ 注意</b><br>'+tip.warn.replace(/^注意：/,'')+'</div>';
    }
    if(park){
      const nav="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(park.q);
      inner+='<div class="mini-info mini-parking"><b>🅿️ '+park.name+'</b><br>'+
        '車位：'+park.spaces+' ｜ 費用：'+park.fee+'<br>'+
        park.note+'<br><a target="_blank" rel="noopener" href="'+nav+'">停車導航 →</a></div>';
    }
    inner+='</div>';
    details.innerHTML=inner;

    const item=place.closest(".item");
    const btnrow=item?.querySelector(".btnrow");
    if(btnrow) btnrow.insertAdjacentElement("afterend",details);
    else place.insertAdjacentElement("afterend",details);
  });

function initTripMap(){
  const mapEl = document.getElementById("tripMap");
  if(!mapEl) return;

  if(typeof L === "undefined"){
    mapEl.innerHTML = '<div class="map-load-error" style="display:block">⚠️ 地圖元件載入失敗。請確認目前有網路連線，重新整理頁面後再試。你仍可使用各行程卡上的 Google Maps 導航按鈕。</div>';
    return;
  }

  const colors={1:"#0b8f9b",2:"#e67e22",3:"#8e63ce",4:"#e2566c",5:"#5e7fa3"};
  const typeMeta={
    attraction:{emoji:"📸",label:"景點"},
    restaurant:{emoji:"🍴",label:"餐廳"},
    cafe:{emoji:"☕",label:"咖啡"},
    shopping:{emoji:"🛍️",label:"購物"},
    foodmarket:{emoji:"🐟",label:"市場／美食"},
    transport:{emoji:"🚗",label:"交通"}
  };

  const map=L.map("tripMap",{scrollWheelZoom:false,zoomControl:true}).setView([26.34,127.78],9);
  window.tripMapInstance=map;

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
    maxZoom:19,
    attribution:'&copy; OpenStreetMap contributors',
    crossOrigin:true
  }).addTo(map);

  const layers=[];

  tripPoints.forEach((p,i)=>{
    const tm=typeMeta[p.type]||typeMeta.attraction;
    const icon=L.divIcon({
      className:"trip-number-marker",
      html:
        '<div class="poi-marker" style="background:'+colors[p.day]+'">'+
          '<span class="route-order'+(String(p.order).length>3?' compact':'')+'">'+p.order+'</span>'+
          '<span class="day-tag" style="color:'+colors[p.day]+'">D'+p.day+'</span>'+
          '<span class="type-badge">'+tm.emoji+'</span>'+
        '</div>',
      iconSize:[44,44],
      iconAnchor:[22,22],
      popupAnchor:[0,-23]
    });

    const nav="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p.q);
    const parkingNav="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p.parkingQ||p.q);

    const marker=L.marker([p.lat,p.lng],{
      icon,title:p.name,keyboard:true,riseOnHover:true,zIndexOffset:400
    }).bindPopup(
      '<div class="popup-type">'+tm.emoji+' '+tm.label+' · DAY '+p.day+'</div>'+
      '<div class="popup-order">第 '+p.order+' 站'+(p.branch?' · '+p.branch:'')+'</div>'+
      '<div class="popup-title">'+p.name+'</div>'+
      '<div class="popup-meta">點下方按鈕交給 Google Maps 做實際導航</div>'+
      '<div class="popup-parking"><b>🅿️ 停車：</b>'+p.parking+'</div>'+
      '<a class="popup-nav" target="_blank" rel="noopener" href="'+nav+'">📍 景點導航</a> '+
      '<a class="popup-nav" target="_blank" rel="noopener" href="'+parkingNav+'">🅿️ 停車導航</a>'
    ).addTo(map);

    // Parking tag is attached to the same verified POI coordinate when parking is on-site/associated.
    // A pixel offset visually separates it without inventing a different geographic coordinate.
    const pIcon=L.divIcon({
      className:"parking-map-marker",
      html:'<div class="parking-bubble">P</div>',
      iconSize:[28,28],
      iconAnchor:[-7,7],
      popupAnchor:[17,-8]
    });

    const pMarker=L.marker([p.lat,p.lng],{
      icon:pIcon,title:p.name+" 停車資訊",keyboard:true,zIndexOffset:650
    }).bindPopup(
      '<div class="popup-type">🅿️ 停車資訊</div>'+
      '<div class="popup-order">DAY '+p.day+' · 第 '+p.order+' 站</div>'+
      '<div class="popup-title">'+p.name+'</div>'+
      '<div class="popup-meta">'+p.parking+'</div>'+
      '<a class="popup-nav" target="_blank" rel="noopener" href="'+parkingNav+'">🧭 停車場入口導航</a>'
    );

    layers.push({marker,pMarker,day:p.day});
  });

  const allBounds=L.latLngBounds(tripPoints.map(p=>[p.lat,p.lng]));
  map.fitBounds(allBounds.pad(.06));

  setTimeout(()=>map.invalidateSize(),250);
  window.addEventListener("resize",()=>map.invalidateSize());

  let parkingVisible=false;
  const parkingToggle=document.getElementById("parkingToggle");
  if(parkingToggle){
    parkingToggle.addEventListener("click",()=>{
      parkingVisible=!parkingVisible;
      parkingToggle.setAttribute("aria-pressed",String(parkingVisible));
      parkingToggle.classList.toggle("active",parkingVisible);
      parkingToggle.textContent=parkingVisible?"🅿️ 隱藏停車":"🅿️ 顯示停車";

      const activeDay=document.querySelector(".map-filter[data-day].active")?.dataset.day || "all";
      layers.forEach(x=>{
        const show=activeDay==="all" || String(x.day)===activeDay;
        if(parkingVisible && show){
          if(!map.hasLayer(x.pMarker)) x.pMarker.addTo(map);
        }else if(map.hasLayer(x.pMarker)){
          map.removeLayer(x.pMarker);
        }
      });
    });
  }

  document.querySelectorAll(".map-filter[data-day]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      document.querySelectorAll(".map-filter[data-day]").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");

      const d=btn.dataset.day;
      const selected=[];

      layers.forEach(x=>{
        const show=d==="all" || String(x.day)===d;
        if(show){
          if(!map.hasLayer(x.marker)) x.marker.addTo(map);
          if(parkingVisible && !map.hasLayer(x.pMarker)) x.pMarker.addTo(map);
          selected.push(x.marker.getLatLng());
        }else{
          if(map.hasLayer(x.marker)) map.removeLayer(x.marker);
          if(map.hasLayer(x.pMarker)) map.removeLayer(x.pMarker);
        }
      });

      if(selected.length){
        map.fitBounds(L.latLngBounds(selected).pad(.18),{maxZoom:13});
        setTimeout(()=>map.invalidateSize(),100);
      }
    });
  });
}

window.addEventListener("DOMContentLoaded",()=>{
  addCompactDetails();
  initTripMap();
});
</script>


<script>
(() => {
  const FX_URL = "https://open.er-api.com/v6/latest/JPY";
  const FX_CACHE_KEY = "okinawa2026_fx_jpy_twd";
  const EXPENSE_KEY = "okinawa2026_expenses_v2";
  const MEMBER_KEY = "okinawa2026_members_v1";
  const SYNC_CFG_KEY = "okinawa2026_sync_config_v1";
  const DEFAULT_FIREBASE_URL = "https://okinawa2026-537c9-default-rtdb.asia-southeast1.firebasedatabase.app";
  const DEFAULT_SYNC_ROOM = "okinawa-2026";
  let syncTimer = null;
  let syncConfig = null;
  let syncBusy = false;

  let fxRate = 0;
  let fxUpdatedText = "";

  const moneyJPY = n => "¥" + Math.round(Number(n || 0)).toLocaleString("ja-JP");
  const moneyTWD = n => "NT$" + Math.round(Number(n || 0)).toLocaleString("zh-TW");

  function escapeHtml(value){
    return String(value ?? "").replace(/[&<>"']/g, ch=>({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[ch]));
  }

  function getMembers(){
    try{
      const data = JSON.parse(localStorage.getItem(MEMBER_KEY) || "[]");
      if(Array.isArray(data) && data.length) return data;
    }catch(e){}
    const defaults=[{id:"me",name:"我"}];
    localStorage.setItem(MEMBER_KEY, JSON.stringify(defaults));
    return defaults;
  }

  function saveMembers(items){
    localStorage.setItem(MEMBER_KEY, JSON.stringify(items));
    pushCloudState();
  }

  function getExpenses(){
    try{
      const data = JSON.parse(localStorage.getItem(EXPENSE_KEY) || "[]");
      return Array.isArray(data) ? data : [];
    }catch(e){ return []; }
  }

  function saveExpenses(items){
    localStorage.setItem(EXPENSE_KEY, JSON.stringify(items));
    pushCloudState();
  }


  function sanitizeRoom(value){
    return String(value||"").trim().replace(/[.#$\[\]\/]/g,"-").slice(0,40);
  }

  function normalizeFirebaseUrl(value){
    return String(value||"").trim().replace(/\/+$/,"");
  }

  function getSettlementSnapshot(){
    const balances=computeBalances(getExpenses());
    return {
      balances:Object.values(balances),
      settlements:computeSettlements(balances)
    };
  }

  function getSyncState(){
    const snapshot=getSettlementSnapshot();
    return {
      members:getMembers(),
      expenses:getExpenses(),
      balances:snapshot.balances,
      settlements:snapshot.settlements,
      updatedAt:Date.now()
    };
  }

  function setSyncStatus(text, mode="warn"){
    const el=document.getElementById("syncStatus");
    if(!el) return;
    el.textContent=text;
    el.classList.remove("online","warn");
    if(mode) el.classList.add(mode);
  }

  function cloudEndpoint(){
    if(!syncConfig?.url || !syncConfig?.room) return null;
    return `${syncConfig.url}/okinawaTripRooms/${encodeURIComponent(syncConfig.room)}.json`;
  }

  async function pushCloudState(){
    const endpoint=cloudEndpoint();
    if(!endpoint || syncBusy) return;
    try{
      syncBusy=true;
      setSyncStatus("同步中…","warn");
      const res=await fetch(endpoint,{
        method:"PUT",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(getSyncState())
      });
      if(!res.ok) throw new Error("sync write failed");
      setSyncStatus("已同步","online");
      renderExpenses();
      const rs=document.getElementById("sharedResultStatus");
      if(rs) rs.textContent="☁️ 分帳結果已同步，同行者會看到同一份最新結果。";
    }catch(e){
      setSyncStatus("同步失敗","warn");
    }finally{
      syncBusy=false;
    }
  }

  async function pullCloudState(){
    const endpoint=cloudEndpoint();
    if(!endpoint || syncBusy) return;
    try{
      syncBusy=true;
      const res=await fetch(endpoint,{cache:"no-store"});
      if(!res.ok) throw new Error("sync read failed");
      const data=await res.json();
      if(data && Array.isArray(data.members) && Array.isArray(data.expenses)){
        localStorage.setItem(MEMBER_KEY, JSON.stringify(data.members));
        localStorage.setItem(EXPENSE_KEY, JSON.stringify(data.expenses));
        renderMembers();
        renderExpenses();
        const rs=document.getElementById("sharedResultStatus");
        if(rs){
          const t=data.updatedAt ? new Date(data.updatedAt).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"}) : "";
          rs.textContent=`☁️ 已取得最新雲端分帳結果${t ? " · "+t : ""}`;
        }
      }else{
        localStorage.setItem(MEMBER_KEY, JSON.stringify(getMembers()));
        localStorage.setItem(EXPENSE_KEY, JSON.stringify(getExpenses()));
      }
      setSyncStatus("已同步","online");
    }catch(e){
      setSyncStatus("同步失敗","warn");
    }finally{
      syncBusy=false;
    }
  }

  async function connectSync(){
    const room=sanitizeRoom(document.getElementById("syncRoom")?.value || DEFAULT_SYNC_ROOM);
    syncConfig={url:DEFAULT_FIREBASE_URL,room};
    localStorage.setItem(SYNC_CFG_KEY,JSON.stringify(syncConfig));
    setSyncStatus("連線中…","warn");
    await pullCloudState();
    if(syncTimer) clearInterval(syncTimer);
    syncTimer=setInterval(pullCloudState,5000);
  }

  function disconnectSync(){
    if(syncTimer) clearInterval(syncTimer);
    syncTimer=null;
    setSyncStatus("同步已暫停","warn");
  }


  function updateConverter(){
    const yen = Math.max(0, Number(document.getElementById("yenInput")?.value || 0));
    const output = document.getElementById("twdOutput");
    if(output) output.value = fxRate ? moneyTWD(yen * fxRate) : "—";
  }

  function setFxUI(rate, updated, cached=false){
    fxRate = Number(rate) || 0;
    fxUpdatedText = updated || "";
    const rateText = document.getElementById("fxRateText");
    const updatedText = document.getElementById("fxUpdated");
    if(rateText) rateText.textContent = fxRate ? `¥1 ≈ NT$${fxRate.toFixed(4)}` : "匯率暫時無法取得";
    if(updatedText){
      updatedText.innerHTML = fxRate
        ? `資料更新：${fxUpdatedText || "最新可用資料"} ${cached ? '<span class="offline-pill">使用上次匯率</span>' : ""}`
        : "請稍後再按更新；記帳仍可輸入 TWD。";
    }
    updateConverter();
    renderExpenses();
  }

  async function loadFx(force=false){
    const cachedRaw = localStorage.getItem(FX_CACHE_KEY);
    let cached = null;
    try{ cached = cachedRaw ? JSON.parse(cachedRaw) : null; }catch(e){}

    if(!force && cached?.rate && cached?.savedAt && (Date.now()-cached.savedAt)<6*60*60*1000){
      setFxUI(cached.rate, cached.updated || "上次下載", true);
    }

    const btn = document.getElementById("fxRefresh");
    if(btn) btn.disabled = true;
    try{
      const response = await fetch(FX_URL, {cache:"no-store"});
      if(!response.ok) throw new Error("rate request failed");
      const data = await response.json();
      const rate = Number(data?.rates?.TWD);
      if(!rate) throw new Error("TWD rate missing");
      const updated = data.time_last_update_utc
        ? new Date(data.time_last_update_utc).toLocaleString("zh-TW", {timeZone:"Asia/Taipei"})
        : "最新可用資料";
      localStorage.setItem(FX_CACHE_KEY, JSON.stringify({rate, updated, savedAt:Date.now()}));
      setFxUI(rate, updated, false);
    }catch(err){
      if(cached?.rate) setFxUI(cached.rate, cached.updated || "上次下載", true);
      else setFxUI(0, "", false);
    }finally{
      if(btn) btn.disabled = false;
    }
  }

  function toTWD(item){
    if(item.currency === "TWD") return Number(item.amount || 0);
    const rate = Number(item.rate || fxRate || 0);
    return Number(item.amount || 0) * rate;
  }

  function renderMembers(){
    const members=getMembers();
    const list=document.getElementById("peopleList");
    const payer=document.getElementById("expensePayer");
    const split=document.getElementById("splitMembers");

    if(list){
      list.innerHTML=members.map(m=>`
        <span class="person-chip">${escapeHtml(m.name)}
        ${members.length>1 ? `<button type="button" data-remove-member="${m.id}" aria-label="移除 ${escapeHtml(m.name)}">×</button>` : ""}
        </span>`).join("");
      list.querySelectorAll("[data-remove-member]").forEach(btn=>{
        btn.addEventListener("click",()=>{
          const id=btn.dataset.removeMember;
          const next=getMembers().filter(m=>m.id!==id);
          saveMembers(next.length?next:[{id:"me",name:"我"}]);
          renderMembers();
          renderExpenses();
        });
      });
    }

    if(payer){
      const current=payer.value;
      payer.innerHTML=members.map(m=>`<option value="${m.id}">${escapeHtml(m.name)}</option>`).join("");
      if(members.some(m=>m.id===current)) payer.value=current;
    }

    if(split){
      split.innerHTML=members.map(m=>`
        <label class="member-check">
          <input type="checkbox" value="${m.id}" checked>
          ${escapeHtml(m.name)}
        </label>`).join("");
      split.querySelectorAll("input").forEach(x=>x.addEventListener("change",updateSplitPreview));
    }
    updateSplitPreview();
  }

  function updateSplitPreview(){
    const amount=Number(document.getElementById("expenseAmount")?.value || 0);
    const checked=[...document.querySelectorAll("#splitMembers input:checked")];
    const preview=document.getElementById("splitPreview");
    if(!preview) return;
    if(!checked.length){
      preview.textContent="請至少選 1 位分帳成員";
      return;
    }
    if(!amount){
      preview.textContent=`目前 ${checked.length} 人一起分`;
      return;
    }
    const each=amount/checked.length;
    const currency=document.getElementById("expenseCurrency")?.value || "JPY";
    preview.textContent=`${checked.length} 人平均，每人約 ${currency==="JPY" ? moneyJPY(each) : moneyTWD(each)}`;
  }

  function computeBalances(items){
    const members=getMembers();
    const result={};
    members.forEach(m=>result[m.id]={name:m.name,paid:0,owed:0,net:0});

    items.forEach(item=>{
      const amountTwd=toTWD(item);
      if(!result[item.payerId]) return;
      const splitIds=(item.splitIds||[]).filter(id=>result[id]);
      if(!splitIds.length) return;
      result[item.payerId].paid += amountTwd;
      const each=amountTwd/splitIds.length;
      splitIds.forEach(id=>result[id].owed += each);
    });

    Object.values(result).forEach(x=>x.net=x.paid-x.owed);
    return result;
  }

  function computeSettlements(balanceObj){
    const creditors=[], debtors=[];
    Object.entries(balanceObj).forEach(([id,b])=>{
      if(b.net>0.5) creditors.push({id,name:b.name,amt:b.net});
      else if(b.net<-0.5) debtors.push({id,name:b.name,amt:-b.net});
    });
    creditors.sort((a,b)=>b.amt-a.amt);
    debtors.sort((a,b)=>b.amt-a.amt);

    const result=[];
    let i=0,j=0;
    while(i<debtors.length && j<creditors.length){
      const amount=Math.min(debtors[i].amt,creditors[j].amt);
      if(amount>0.5) result.push({from:debtors[i].name,to:creditors[j].name,amount});
      debtors[i].amt-=amount;
      creditors[j].amt-=amount;
      if(debtors[i].amt<=0.5) i++;
      if(creditors[j].amt<=0.5) j++;
    }
    return result;
  }

  function renderBalances(items){
    const grid=document.getElementById("balanceGrid");
    const settle=document.getElementById("settleList");
    if(!grid || !settle) return;
    const balances=computeBalances(items);
    const rows=Object.values(balances);

    grid.innerHTML=rows.map(b=>`
      <div class="balance-row">
        <div>
          <div class="balance-name">${escapeHtml(b.name)}</div>
          <div class="balance-sub">已付 ${moneyTWD(b.paid)} · 應付 ${moneyTWD(b.owed)}</div>
        </div>
        <div class="balance-net ${b.net>=0?'pos':'neg'}">${b.net>=0?'+':''}${moneyTWD(b.net)}</div>
      </div>`).join("");

    const settlements=computeSettlements(balances);
    settle.innerHTML=settlements.length
      ? settlements.map(s=>`<div class="settle-row"><b>${escapeHtml(s.from)}</b> → <b>${escapeHtml(s.to)}</b>：${moneyTWD(s.amount)}</div>`).join("")
      : '<div class="empty-expense">目前沒有需要互相補款的差額。</div>';
  }

  function renderExpenses(){
    const list = document.getElementById("expenseList");
    if(!list) return;
    const members=getMembers();
    const memberMap=Object.fromEntries(members.map(m=>[m.id,m.name]));
    const items = getExpenses();

    const totalJPY = items.filter(x=>x.currency==="JPY").reduce((s,x)=>s+Number(x.amount||0),0);
    const totalTWD = items.reduce((s,x)=>s+toTWD(x),0);

    const sumJPY = document.getElementById("sumJPY");
    const sumTWD = document.getElementById("sumTWD");
    if(sumJPY) sumJPY.textContent = moneyJPY(totalJPY);
    if(sumTWD) sumTWD.textContent = moneyTWD(totalTWD);

    if(!items.length){
      list.innerHTML = '<div class="empty-expense">還沒有支出紀錄。新增第一筆後，下面會自動計算分帳結果。</div>';
      renderBalances(items);
      return;
    }

    list.innerHTML = items.slice().reverse().map(item=>{
      const original = item.currency==="JPY" ? moneyJPY(item.amount) : moneyTWD(item.amount);
      const twd = moneyTWD(toTWD(item));
      const payerName=memberMap[item.payerId] || "未設定";
      const splitNames=(item.splitIds||[]).map(id=>memberMap[id]).filter(Boolean);
      return `
        <div class="expense-row">
          <div class="expense-main">
            <div class="expense-title">${escapeHtml(item.name || item.category)}</div>
            <div class="expense-meta">${escapeHtml(item.day)} · ${escapeHtml(item.category)} · ${escapeHtml(item.currency)}</div>
            <div class="expense-meta">付款：${escapeHtml(payerName)} · 分帳：${escapeHtml(splitNames.join("、") || "未設定")}</div>
          </div>
          <div class="expense-amount">
            <b>${original}</b>
            <span>${item.currency==="JPY" ? `≈ ${twd}` : twd}</span>
            <button class="expense-delete" type="button" data-expense-id="${item.id}">刪除</button>
          </div>
        </div>`;
    }).join("");

    list.querySelectorAll("[data-expense-id]").forEach(btn=>{
      btn.addEventListener("click",()=>{
        const id = btn.dataset.expenseId;
        saveExpenses(getExpenses().filter(x=>String(x.id)!==String(id)));
        renderExpenses();
      });
    });

    renderBalances(items);
  }

  function exportCSV(){
    const items = getExpenses();
    if(!items.length) return;
    const members=getMembers();
    const memberMap=Object.fromEntries(members.map(m=>[m.id,m.name]));
    const rows = [
      ["Day","Category","Name","Currency","Amount","Payer","Split_With","JPY_to_TWD_Rate","Estimated_TWD"],
      ...items.map(x=>[
        x.day,x.category,x.name,x.currency,x.amount,
        memberMap[x.payerId]||"",
        (x.splitIds||[]).map(id=>memberMap[id]).filter(Boolean).join("|"),
        x.currency==="JPY" ? (x.rate || "") : "",
        Math.round(toTWD(x))
      ])
    ];
    const csv = "\ufeff" + rows.map(row=>row.map(v=>{
      const s=String(v??"").replace(/"/g,'""');
      return `"${s}"`;
    }).join(",")).join("\n");

    const blob = new Blob([csv],{type:"text/csv;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href=url;
    a.download="okinawa-trip-expenses-split.csv";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),500);
  }

  document.getElementById("addMember")?.addEventListener("click",()=>{
    const input=document.getElementById("newMemberName");
    const name=(input?.value||"").trim();
    if(!name) return;
    const members=getMembers();
    members.push({id:"m"+Date.now(),name});
    saveMembers(members);
    if(input) input.value="";
    renderMembers();
    renderExpenses();
  });

  document.getElementById("newMemberName")?.addEventListener("keydown",e=>{
    if(e.key==="Enter"){
      e.preventDefault();
      document.getElementById("addMember")?.click();
    }
  });

  document.getElementById("yenInput")?.addEventListener("input", updateConverter);
  document.getElementById("fxRefresh")?.addEventListener("click",()=>loadFx(true));
  document.getElementById("expenseAmount")?.addEventListener("input",updateSplitPreview);
  document.getElementById("expenseCurrency")?.addEventListener("change",updateSplitPreview);

  document.getElementById("expenseForm")?.addEventListener("submit",e=>{
    e.preventDefault();
    const day=document.getElementById("expenseDay").value;
    const category=document.getElementById("expenseCategory").value;
    const name=(document.getElementById("expenseName").value || "").trim();
    const currency=document.getElementById("expenseCurrency").value;
    const amount=Number(document.getElementById("expenseAmount").value);
    const payerId=document.getElementById("expensePayer").value;
    const splitIds=[...document.querySelectorAll("#splitMembers input:checked")].map(x=>x.value);

    if(!Number.isFinite(amount) || amount<=0 || !payerId || !splitIds.length) return;

    const items=getExpenses();
    items.push({
      id:Date.now(),
      day,category,
      name:name || category,
      currency,amount,
      payerId,
      splitIds,
      splitMode:"equal",
      rate:currency==="JPY" ? (fxRate || 0) : null,
      createdAt:new Date().toISOString()
    });
    saveExpenses(items);
    document.getElementById("expenseName").value="";
    document.getElementById("expenseAmount").value="";
    renderExpenses();
    updateSplitPreview();
  });


  document.getElementById("undoLastExpense")?.addEventListener("click",()=>{
    const items=getExpenses();
    if(!items.length) return;
    const last=items[items.length-1];
    const label=last?.name || last?.category || "上一筆";
    if(confirm(`刪除上一筆「${label}」？`)){
      items.pop();
      saveExpenses(items);
      renderExpenses();
    }
  });

  document.getElementById("exportExpense")?.addEventListener("click",exportCSV);

  document.getElementById("clearExpense")?.addEventListener("click",()=>{
    if(!getExpenses().length) return;
    if(confirm("確定要清除全部旅行記帳資料嗎？這會同步清除同行者看到的共用記錄。")){
      saveExpenses([]);
      renderExpenses();
    }
  });



  const settlementToggle=document.getElementById("toggleSettlementResult");
  const settlementPanel=document.getElementById("settlementResultPanel");
  settlementToggle?.addEventListener("click",()=>{
    const willOpen=!settlementPanel?.classList.contains("open");
    settlementPanel?.classList.toggle("open",willOpen);
    settlementToggle.setAttribute("aria-expanded",String(willOpen));
    const label=settlementToggle.querySelector("span:first-child");
    if(label) label.textContent=willOpen ? "隱藏最終分帳結果" : "查看最終分帳結果";
  });

  document.getElementById("retrySync")?.addEventListener("click",connectSync);

  try{
    syncConfig={url:DEFAULT_FIREBASE_URL,room:DEFAULT_SYNC_ROOM};
    localStorage.setItem(SYNC_CFG_KEY,JSON.stringify(syncConfig));
    const roomEl=document.getElementById("syncRoom");
    if(roomEl) roomEl.value=DEFAULT_SYNC_ROOM;
    setTimeout(connectSync,250);
  }catch(e){}

  renderMembers();
  renderExpenses();
  loadFx(false);
})();
</script>


<script>
(() => {
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  let source = "zh-TW";
  let target = "ja";
  let recognition = null;
  let listening = false;

  const labels = {
    "zh-TW": {short:"🇹🇼 中文", title:"中文原文", voice:"zh-TW"},
    "ja": {short:"🇯🇵 日本語", title:"日文原文", voice:"ja-JP"}
  };

  const phrasesZH = [
    "請問有停車場嗎？",
    "停車一小時多少錢？",
    "可以刷信用卡嗎？",
    "請問可以免稅嗎？",
    "兩位，請問現在有位子嗎？",
    "請不要加蔥，謝謝。",
    "這個可以帶回台灣嗎？",
    "請問廁所在哪裡？",
    "可以幫我拍照嗎？",
    "請問這班車到那霸機場嗎？"
  ];

  const phrasesJA = [
    "駐車場はありますか？",
    "駐車料金は1時間いくらですか？",
    "クレジットカードは使えますか？",
    "免税できますか？",
    "二人ですが、今入れますか？",
    "ネギ抜きでお願いします。",
    "これは台湾に持ち帰れますか？",
    "トイレはどこですか？",
    "写真を撮ってもらえますか？",
    "このバスは那覇空港に行きますか？"
  ];

  const $ = id => document.getElementById(id);

  function escapeHtml(value){
    return String(value ?? "").replace(/[&<>"']/g, ch=>({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[ch]));
  }

  function updateLanguageUI(){
    $("sourceLangLabel").textContent = labels[source].short;
    $("targetLangLabel").textContent = labels[target].short;
    $("sourceTitle").textContent = labels[source].title;
    $("targetTitle").textContent = labels[target].title.replace("原文","翻譯");
    $("sourceText").placeholder = source==="zh-TW"
      ? "也可以直接打字，例如：請問有停車場嗎？"
      : "文字入力もできます。例：駐車場はありますか？";
    renderPhrases();
  }

  function renderPhrases(){
    const phrases = source==="zh-TW" ? phrasesZH : phrasesJA;
    $("phraseList").innerHTML = phrases.map(p =>
      `<button class="phrase" type="button" data-phrase="${escapeHtml(p)}">${escapeHtml(p)}</button>`
    ).join("");
    $("phraseList").querySelectorAll("[data-phrase]").forEach(btn=>{
      btn.addEventListener("click",()=>{
        $("sourceText").value = btn.dataset.phrase || "";
        translateText();
      });
    });
  }

  function setStatus(text, active=false){
    const el=$("voiceStatus");
    el.textContent=text;
    el.classList.toggle("listening",active);
  }

  function stopRecognition(){
    if(recognition && listening){
      try{ recognition.stop(); }catch(e){}
    }
    listening=false;
    $("micBtn").classList.remove("recording");
    $("micBtn").textContent="🎙️ 開始說話";
  }

  function makeRecognition(){
    if(!SpeechRecognitionCtor) return null;
    const r = new SpeechRecognitionCtor();
    r.lang = source==="zh-TW" ? "zh-TW" : "ja-JP";
    r.interimResults = true;
    r.continuous = false;
    r.maxAlternatives = 1;

    let finalText="";
    r.onstart=()=>{
      listening=true;
      $("micBtn").classList.add("recording");
      $("micBtn").textContent="■ 停止";
      setStatus("正在聽… 說完一句後會自動翻譯。",true);
    };
    r.onresult=e=>{
      let interim="";
      for(let i=e.resultIndex;i<e.results.length;i++){
        const text=e.results[i][0].transcript;
        if(e.results[i].isFinal) finalText += text;
        else interim += text;
      }
      $("sourceText").value=(finalText || interim).trim();
    };
    r.onerror=e=>{
      listening=false;
      $("micBtn").classList.remove("recording");
      $("micBtn").textContent="🎙️ 開始說話";
      const msg = e.error==="not-allowed"
        ? "麥克風權限未開啟，請允許瀏覽器使用麥克風。"
        : "語音辨識暫時失敗，可直接輸入文字翻譯。";
      setStatus(msg,false);
    };
    r.onend=()=>{
      listening=false;
      $("micBtn").classList.remove("recording");
      $("micBtn").textContent="🎙️ 開始說話";
      const text=$("sourceText").value.trim();
      if(text){
        setStatus("已辨識，正在翻譯…",false);
        translateText();
      }else{
        setStatus("沒有聽清楚，請再試一次。",false);
      }
    };
    return r;
  }

  async function translateText(){
    const text=$("sourceText").value.trim();
    if(!text){
      setStatus("請先說話或輸入文字。",false);
      return;
    }

    stopRecognition();
    $("translateBtn").disabled=true;
    $("translatedText").textContent="翻譯中…";
    $("translationFallback").innerHTML="";

    const pair = source==="zh-TW" ? "zh-TW|ja" : "ja|zh-TW";
    const endpoint = "https://api.mymemory.translated.net/get?q=" +
      encodeURIComponent(text) + "&langpair=" + encodeURIComponent(pair);

    try{
      const res=await fetch(endpoint,{cache:"no-store"});
      if(!res.ok) throw new Error("translation service error");
      const data=await res.json();
      const translated=data?.responseData?.translatedText;
      if(!translated) throw new Error("empty translation");
      $("translatedText").textContent=translated;
      setStatus("翻譯完成。",false);
      if($("autoSpeak").checked) speakTranslation();
    }catch(err){
      $("translatedText").textContent="翻譯服務暫時無法連線。";
      const googleLang = source==="zh-TW" ? ["zh-TW","ja"] : ["ja","zh-TW"];
      const url="https://translate.google.com/?sl="+googleLang[0]+"&tl="+googleLang[1]+"&text="+encodeURIComponent(text)+"&op=translate";
      $("translationFallback").innerHTML='可改用 <a target="_blank" rel="noopener" href="'+url+'">Google 翻譯開啟這句話 ↗</a>';
      setStatus("語音辨識可用，但翻譯服務目前連線失敗。",false);
    }finally{
      $("translateBtn").disabled=false;
    }
  }

  function speakTranslation(){
    const text=$("translatedText").textContent.trim();
    if(!text || text==="翻譯結果會顯示在這裡。" || text==="翻譯中…") return;
    stopRecognition();
    if(!("speechSynthesis" in window)){
      setStatus("這個瀏覽器不支援語音朗讀。",false);
      return;
    }
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = labels[target].voice;
    utter.rate = 0.95;
    utter.pitch = 1;
    utter.onstart=()=>setStatus("正在朗讀翻譯…",false);
    utter.onend=()=>setStatus("朗讀完成。",false);
    utter.onerror=()=>setStatus("語音朗讀失敗，可直接把畫面給對方看。",false);
    window.speechSynthesis.speak(utter);
  }

  $("swapLang").addEventListener("click",()=>{
    stopRecognition();
    window.speechSynthesis?.cancel?.();
    [source,target]=[target,source];
    const oldSource=$("sourceText").value.trim();
    const oldTarget=$("translatedText").textContent.trim();
    if(oldTarget && oldTarget!=="翻譯結果會顯示在這裡。" && oldTarget!=="翻譯中…" && !oldTarget.includes("無法連線")){
      $("sourceText").value=oldTarget;
      $("translatedText").textContent=oldSource || "翻譯結果會顯示在這裡。";
    }
    updateLanguageUI();
    setStatus("語言方向已交換。",false);
  });

  $("micBtn").addEventListener("click",()=>{
    if(listening){
      stopRecognition();
      return;
    }
    if(!SpeechRecognitionCtor){
      setStatus("這個瀏覽器不支援網頁語音辨識；請直接輸入文字，仍可翻譯與朗讀。",false);
      return;
    }
    window.speechSynthesis?.cancel?.();
    recognition=makeRecognition();
    try{ recognition.start(); }
    catch(e){ setStatus("目前無法啟動麥克風，請稍後再試。",false); }
  });

  $("translateBtn").addEventListener("click",translateText);
  $("speakBtn").addEventListener("click",speakTranslation);
  $("clearTranslate").addEventListener("click",()=>{
    stopRecognition();
    window.speechSynthesis?.cancel?.();
    $("sourceText").value="";
    $("translatedText").textContent="翻譯結果會顯示在這裡。";
    $("translationFallback").innerHTML="";
    setStatus("點「開始說話」後講一句話；說完會自動辨識並翻譯。",false);
  });

  updateLanguageUI();

  if(!SpeechRecognitionCtor){
    setStatus("目前瀏覽器未提供網頁語音辨識；可使用文字翻譯＋朗讀。建議以 Safari/Chrome 實機測試。",false);
  }
})();
</script>

<script>
(() => {
  const KEY="okinawa_font_size_v1";
  const allowed=["small","medium","large"];
  let saved=localStorage.getItem(KEY);
  if(!allowed.includes(saved)) saved="medium";

  function applyFontSize(size){
    if(!allowed.includes(size)) size="medium";
    document.documentElement.setAttribute("data-font-size",size);
    localStorage.setItem(KEY,size);
    document.querySelectorAll(".font-size-btn").forEach(btn=>{
      const active=btn.dataset.fontSize===size;
      btn.classList.toggle("active",active);
      btn.setAttribute("aria-pressed",String(active));
    });
    if(window.tripMapInstance){
      setTimeout(()=>window.tripMapInstance.invalidateSize(),80);
    }
  }

  document.querySelectorAll(".font-size-btn").forEach(btn=>{
    btn.addEventListener("click",()=>applyFontSize(btn.dataset.fontSize));
  });
  applyFontSize(saved);
})();
</script>


<script>
(() => {
  function makeBtn(labelClosed, labelOpen){
    const btn=document.createElement("button");
    btn.type="button";
    btn.className="compact-toggle-btn";
    btn.setAttribute("aria-expanded","false");
    btn.innerHTML=`<span class="compact-label">${labelClosed}</span><span class="arrow">⌄</span>`;
    btn.addEventListener("click",(e)=>{
      e.preventDefault();
      e.stopPropagation();
      const card=btn.closest(".spot-card,.restaurant-card,.coupon-card");
      if(!card) return;
      const willOpen=card.classList.contains("compact-collapsed");
      card.classList.toggle("compact-collapsed",!willOpen);
      btn.setAttribute("aria-expanded",String(willOpen));
      const label=btn.querySelector(".compact-label");
      if(label) label.textContent=willOpen ? labelOpen : labelClosed;
    });
    return btn;
  }

  document.querySelectorAll("#spots .spot-card").forEach(card=>{
    card.classList.add("compact-collapsed");
    const body=card.querySelector(".spot-body");
    const h3=body?.querySelector("h3");
    if(!body || !h3 || body.querySelector(".spot-compact-row")) return;
    const row=document.createElement("div");
    row.className="spot-compact-row";
    h3.parentNode.insertBefore(row,h3);
    row.appendChild(h3);
    row.appendChild(makeBtn("看詳細","收起"));
  });

  document.querySelectorAll("#restaurants .restaurant-card").forEach(card=>{
    card.classList.add("compact-collapsed");
    const head=card.querySelector(".restaurant-head");
    if(!head || head.querySelector(".compact-toggle-btn")) return;
    head.appendChild(makeBtn("看攻略","收起"));
  });

  document.querySelectorAll("#savings .coupon-card").forEach(card=>{
    card.classList.add("compact-collapsed");
    const top=card.querySelector(".coupon-top");
    if(!top || top.querySelector(".compact-toggle-btn")) return;
    top.appendChild(makeBtn("看條件","收起"));
  });
})();
</script>
